# pixelcoords configuration.
# Copy to your OS config dir as pixelcoords/config.toml, or pass --config PATH.
#   macOS:   ~/Library/Application Support/pixelcoords/config.toml
#   Linux:   ~/.config/pixelcoords/config.toml
#   Windows: %APPDATA%\pixelcoords\config.toml
# Every field is optional; these are the defaults.

# Which monitors a launch with no --monitor flag freezes. "all" is the
# default. Otherwise a query, or a list of them: an index, "primary", or
# part of a display name (run `pixelcoords doctor` to see the names).
# This is how a double-clicked binary — no terminal, no flags — expresses
# a preference. A --monitor flag always overrides it.
[capture]
monitors = "all"           # or "primary", or ["DELL", "Built-in"]

[style]
preview_color = "#00A0FF"  # outline while dragging a shape out
complete_color = "#00FF66" # outline of committed shapes
label_color = "#FFFFFF"    # captions and the HUD
target_color = "#FFB000"   # border around the --target window
thickness = 2              # outline width in logical px (0 hides outlines)
fill = false               # fill shapes instead of outlining

# Edge snapping: the drawn point is pulled onto UI edges detected in the
# frozen screenshot. X toggles it for the rest of a run (the toggle does
# not persist — this file owns the default). Arrow-key nudging is never
# snapped; it always means exactly one pixel.
[snap]
enabled = true             # snapping starts on
radius = 8                 # search distance in logical px (1-64)

# Constraints on what a session may hold. Separate from [overlay] below
# because these bound the data, not the feel.
[limits]
label_length = 64          # characters; the ceiling is 80, set by what a
                           # crop's filename can be rather than by taste

# How the overlay feels. None of these change what is saved — the right
# number is a matter of hand, screen, and eyesight.
[overlay]
polygon_sides = 6          # sides the polygon tool opens on. The digit
                           # keys reach 3-9 because that is what one
                           # keypress can say; set anything up to 1000 here
grab_tolerance = 6         # logical px, scaled per monitor. Larger is
                           # easier on a trackpad and makes small shapes
                           # harder to click inside
loupe_radius = 15          # the magnifier shows a 2r+1 pixel square, so
                           # larger trades magnification for context
flash_ms = 2500            # saves and errors — the messages worth reading
flash_brief_ms = 1200      # tool switches — the ones you already know
caret_blink_ms = 500       # 0 stops the blink and leaves the caret solid

# Extra key bindings; later entries override earlier ones (and these
# override the defaults). ACTIONS: quit, save, next_tool, delete_at_cursor,
# label_edit_at_cursor, undo, redo, cycle_overlap, toggle_panel,
# name_session, release_monitor, rotate_ccw, rotate_cw, toggle_snap.
# EDGE: press (default), release, repeat. WHEN: has_selection, cursor_in.
#
# Example: bring back bracket-key rotation alongside Q/E.
# [[hotkeys]]
# key = "["
# action = "rotate_ccw"
# edge = "repeat"
# when = "cursor_in"
