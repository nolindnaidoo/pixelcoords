name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Builds only. This job must NOT touch the release: four matrix jobs each
  # calling action-gh-release is a check-then-act race — the action looks the
  # release up by tag and creates it when absent, so two jobs finishing in the
  # same second both see "absent" and both create one. That is exactly what
  # happened at v0.7.0: one run, two drafts, created at the same timestamp,
  # one holding all four archives and one holding nothing.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux capture dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-randr0-dev libpipewire-0.3-dev libclang-dev libegl1-mesa-dev libgbm-dev pkg-config
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pixelcoords
      - name: Package
        shell: bash
        run: |
          name="pixelcoords-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md config.example.toml "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pixelcoords.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/pixelcoords" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-${{ matrix.target }}
          path: |
            pixelcoords-*.tar.gz
            pixelcoords-*.zip
          if-no-files-found: error
          retention-days: 1

  # One job, one caller, one release. `needs: build` means every archive
  # exists before this runs, so the draft is complete the moment it appears
  # rather than filling in as jobs land.
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Show what will be attached
        run: ls -l archives
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            archives/pixelcoords-*.tar.gz
            archives/pixelcoords-*.zip

  # Keep the Homebrew tap in step with the tag that just shipped.
  #
  # After `release`, because the sha256 must come from the archives this run
  # built and uploaded, not from a local copy that might differ. Needs a
  # token that can write to another repository, which GITHUB_TOKEN cannot.
  #
  # A missing secret is a skip, not a failure. The release is the product; a
  # tap that lags by one version is a smaller problem than a red run on a
  # tag that shipped correctly.
  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Bump the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap bump"
            exit 0
          fi
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arm=$(sha256sum "archives/pixelcoords-v${version}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          intel=$(sha256sum "archives/pixelcoords-v${version}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/nolindnaidoo/homebrew-tap.git" tap
          python3 scripts/bump-homebrew.py "$version" "$arm" "$intel" tap/Formula/pixelcoords.rb

          cd tap
          if git diff --quiet; then
            echo "::notice::formula already current; nothing to push"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "pixelcoords ${version}"
          git push
