name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Builds only. This job must NOT touch the release: four matrix jobs each
  # calling action-gh-release is a check-then-act race — the action looks the
  # release up by tag and creates it when absent, so two jobs finishing in the
  # same second both see "absent" and both create one. That is exactly what
  # happened at v0.7.0: one run, two drafts, created at the same timestamp,
  # one holding all four archives and one holding nothing.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux capture dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-randr0-dev libpipewire-0.3-dev libclang-dev libegl1-mesa-dev libgbm-dev pkg-config
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pixelcoords
      - name: Package
        shell: bash
        run: |
          name="pixelcoords-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md config.example.toml "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pixelcoords.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/pixelcoords" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-${{ matrix.target }}
          path: |
            pixelcoords-*.tar.gz
            pixelcoords-*.zip
          if-no-files-found: error
          retention-days: 1

  # One job, one caller, one release. `needs: build` means every archive
  # exists before this runs, so the draft is complete the moment it appears
  # rather than filling in as jobs land.
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Show what will be attached
        run: ls -l archives
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            archives/pixelcoords-*.tar.gz
            archives/pixelcoords-*.zip
