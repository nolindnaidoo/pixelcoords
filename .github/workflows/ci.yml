name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux capture dependencies
        if: runner.os == 'Linux'
        # The runners' apt mirror occasionally hangs mid-fetch; without a
        # timeout that stalls a required check for hours. Fail in minutes
        # and retry transient fetch errors instead.
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 libxcb1-dev libxcb-randr0-dev libpipewire-0.3-dev libclang-dev libegl1-mesa-dev libgbm-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked

  # A screen-capture tool needs a test that captures a screen. The unit
  # suite covers geometry, the schema and the matcher; none of it looks at
  # a display.
  #
  # All three runners turn out to have one — macOS without a TCC prompt,
  # Windows with a real desktop, Linux under Xvfb — so this runs
  # everywhere rather than on the one platform that was easy. Windows has
  # the least hand-verification behind it, which makes it the most
  # valuable of the three.
  #
  # The overlay stays out: it is interactive, and `AGENTS.md` says so.
  #
  # Single-threaded on purpose. Every scenario captures, and concurrent
  # captures of the same display fail on macOS.
  scenarios:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Install Linux capture dependencies and a virtual X server
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            libxcb1-dev libxcb-randr0-dev libpipewire-0.3-dev libclang-dev \
            libegl1-mesa-dev libgbm-dev pkg-config xvfb
      - name: Capture scenarios against this platform's display
        if: runner.os != 'Linux'
        env:
          PIXELCOORDS_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1
      - name: Capture scenarios against a virtual X server
        if: runner.os == 'Linux'
        env:
          PIXELCOORDS_SCENARIOS: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            cargo test --test scenarios -- --test-threads=1

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
      - name: Install Linux capture dependencies
        # Same stall guard as the test job above.
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 libxcb1-dev libxcb-randr0-dev libpipewire-0.3-dev libclang-dev libegl1-mesa-dev libgbm-dev pkg-config
      - name: Verify the declared rust-version actually builds
        run: cargo check --workspace --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Forbid inline lint suppressions
        run: |
          if grep -rn '#\[allow(' crates --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [workspace.lints].'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for the core crate.
  # Enforced per module, not on the total: a total hides one module
  # sliding while the others carry it.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-llvm-cov
      # No apt dependencies on purpose: pixelcoords-core is platform-free,
      # so needing them here would itself be the bug.
      - name: Measure core coverage
        # Run the tests once, then render both reports from that data.
        run: |
          cargo llvm-cov -p pixelcoords-core --no-report
          cargo llvm-cov report -p pixelcoords-core --json --output-path coverage.json
          cargo llvm-cov report -p pixelcoords-core --html
      - name: Publish the browsable report
        # Uploaded even when the floor check below fails — a failing run is
        # exactly when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor
        run: |
          python3 - <<'PY'
          import json, sys
          FLOOR = 90.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          for f in files:
              name = f["filename"].split("/")[-1]
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:16} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-audit
      # Exceptions, with the reasoning for each, live in .cargo/audit.toml.
      - run: cargo audit
