name: Feature request
description: Something pixelcoords should do and doesn't.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Check the README's **Non-goals** section first — those are
        settled and won't be reopened.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What you're trying to do and where the tool stops short. The
        problem matters more than the proposed feature — a different fix
        may fall out of it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Optional — how you imagine it working.
