[package]
name = "pixelcoords"
description = "Freeze your screen, mark regions, get pixel-exact coordinates and crops — a cross-platform screenshot and screen-capture CLI for macOS, Windows, and Linux (X11 and Wayland), HiDPI and multi-monitor aware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true
# The tool's five slots, chosen against what each keyword page actually
# contains rather than what the word means to us. `coordinates` and
# `overlay` are gone: the first is owned by astronomy and geodesy crates,
# the second by struct-patch and netlink. `screen-capture` replaces the
# bare `capture` — the browse page is exact-match, but free-text search
# splits the hyphen, so the compound wins both. `hidpi` is the one-crate
# page next to winit's `dpi`, and mixed-DPI correctness is the whole point.
# Keywords earn their slot by adding a term the description does not
# already carry — crates.io searches name, description, and keywords
# together, so "screenshot", "screen-capture", and "hidpi" were spending
# three of five slots on words already one line above. Counts are crates
# carrying that keyword: automation 1402, testing 2108, ui 1852,
# agent 3412, against hidpi 3 and computer-use 11.
keywords = ["screenshot", "automation", "testing", "ui", "agent"]
# No multimedia::images here. That category is "crates that process or
# build images", and the binary writing PNG crops is a side effect of
# what it does, not what it is: a terminal tool you run to get
# coordinates and verify them. The library, which really does the image
# work, keeps it.
categories = [
    "command-line-utilities",
    "development-tools::testing",
    "development-tools",
]

[dependencies]
pixelcoords-core = { path = "../pixelcoords-core", version = "0.4.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde_json = "1"
softbuffer = "0.4"
time = { version = "0.3", features = ["formatting"] }
toml = "1"
winit = "0.30"
xcap = "0.9"

# X11 only, and only to read _GTK_FRAME_EXTENTS: toolkits draw an invisible
# shadow outside the window they appear to be, and xcap reports the outer
# frame, so window-relative coordinates would be offset by the shadow.
# Already in the tree as an xcap dependency.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"
# The xdg-desktop-portal window picker behind --pick. Blocking API only —
# no async runtime enters our code — and zbus is already compiled into
# every Linux build as xcap's own portal transport, same version.
zbus = "5.17"

[lints]
workspace = true
