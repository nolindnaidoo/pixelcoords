[package]
name = "pixelcoords-core"
description = "Platform-free core of pixelcoords: screen geometry, HiDPI and multi-monitor coordinate spaces, the session.json schema, template relocation, point verdicts, click-point resolution, region diffing, and click-code emitters. Cross-platform (macOS, Windows, Linux), no unsafe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
# The library's slots, not the tool's. What someone building on this crate
# searches for is the coordinate model — the thing the README says you must
# get right — so `geometry`, `hidpi`, and `multi-monitor` lead. `screenshot`
# is the one bridge back to the binary. NOT `command-line-utilities`: this
# is a library, and filing it there was simply wrong. `computer-vision` is
# matcher.rs; `graphics` is geometry.rs, draw.rs, and font.rs.
# Same rule as the binary: "hidpi" and "multi-monitor" were already in
# the description above and carry 3 and 4 crates respectively, so they
# bought nothing. `geometry` stays — it is what a library consumer
# actually searches, and it is the top row of the module table.
keywords = ["geometry", "screenshot", "automation", "testing", "agent"]
categories = [
    "development-tools::testing",
    "development-tools",
    "computer-vision",
    "graphics",
    "multimedia::images",
]

[dependencies]
# Rasterizes the embedded JetBrains Mono for overlay text — pure Rust,
# platform-free, no transitive dependencies of its own beyond hashbrown.
# The hand-made bitmap glyph table it replaces was the visible ceiling on
# text quality; antialiased vector type is the last step on that axis.
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Tests only. The geometry here is arithmetic with invariants that hold for
# every input — a clamped shape stays in bounds, rotation is periodic — and
# example-based tests only ever check the examples someone thought of.
proptest = "1"
serde_json = "1"
toml = "1"

[lints]
workspace = true
